name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
type: Feature
labels: ["needs-triage"]
projects: ["CSIOntario/1"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How do you envision this working?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (mockups, links, examples, etc.)
